<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GTA 6 meme · make.fun</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 675px; overflow: hidden; background: #0b0518; }
  .stage { position: relative; width: 1200px; height: 675px; overflow: hidden;
           font-family: "Liberation Sans Narrow", "DejaVu Sans", sans-serif; }

  /* sky */
  .sky { position: absolute; inset: 0 0 205px 0;
         background: linear-gradient(180deg, #0a0520 0%, #1e0a3c 22%, #4d1052 45%,
                     #952061 64%, #d23a5e 78%, #ff7a35 92%, #ffc46b 100%); }
  .sun { position: absolute; left: 500px; top: 250px; width: 210px; height: 210px;
         border-radius: 50%; background: radial-gradient(circle at 50% 40%, #fff2b8, #ffcf6a 45%, #ff8a3d 72%, rgba(255,120,50,0) 73%); }
  .sun-stripes { position: absolute; left: 490px; top: 300px; width: 230px; height: 165px;
         background: repeating-linear-gradient(180deg, rgba(11,5,24,0) 0 12px, rgba(11,5,24,.85) 12px 18px); }

  /* skyline */
  .skyline { position: absolute; left: 0; right: 0; bottom: 205px; height: 150px; }
  .skyline svg { display: block; }

  /* water */
  .water { position: absolute; left: 0; right: 0; bottom: 120px; height: 86px;
           background: linear-gradient(180deg, #6c1a56 0%, #33093f 55%, #170524 100%); }
  .glitter { position: absolute; left: 520px; bottom: 122px; width: 170px; height: 80px;
             background: repeating-linear-gradient(180deg, rgba(255,203,120,.85) 0 3px, rgba(255,203,120,0) 3px 11px);
             -webkit-mask-image: radial-gradient(ellipse at 50% 0, #000 12%, transparent 62%); }

  /* beach */
  .beach { position: absolute; left: 0; right: 0; bottom: 0; height: 122px;
           background: linear-gradient(180deg, #12071f 0%, #0a0414 100%); }

  /* palms */
  .palm { position: absolute; bottom: 90px; }
  .palm.left  { left: -20px;  height: 470px; }
  .palm.right { right: -30px; height: 400px; }

  /* headline */
  .scrim { position: absolute; left: 0; right: 0; top: 0; height: 470px;
           background: radial-gradient(ellipse at 50% 40%, rgba(6,2,14,.62) 0%, rgba(6,2,14,.30) 55%, rgba(6,2,14,0) 78%); }

  .kicker { position: absolute; top: 34px; left: 0; right: 0; text-align: center;
            font-size: 26px; font-weight: 700; letter-spacing: 9px; color: #ffe9c9;
            text-transform: uppercase; opacity: .92; }

  .wasted { position: absolute; top: 92px; left: 0; right: 0; text-align: center;
            font-size: 176px; font-weight: 700; line-height: 1; letter-spacing: 4px;
            color: #e11d2e; text-transform: uppercase;
            text-shadow: 0 6px 0 #6d0714, 0 0 46px rgba(225,29,46,.55); }

  .ghost { position: absolute; right: 132px; top: 132px; width: 150px; height: 168px;
           filter: drop-shadow(0 0 26px rgba(255,255,255,.35)); }

  .caption { position: absolute; top: 300px; left: 0; right: 0; text-align: center;
             color: #fff; font-weight: 700; font-size: 56px; line-height: 1.14;
             text-shadow: 0 3px 0 rgba(0,0,0,.65), 0 0 24px rgba(0,0,0,.5); }
  .caption .pay { color: #ffd166; }

  /* footer */
  .footer { position: absolute; left: 0; right: 0; bottom: 0; height: 108px;
            background: #100718; border-top: 4px solid #ff2f8e; display: flex;
            align-items: center; padding: 0 46px; gap: 26px; }
  .footer .mark { width: 62px; height: 70px; flex: none; }
  .footer .word { color: #fff; font-size: 52px; font-weight: 700; letter-spacing: -1px; }
  .footer .word .dot { color: #ff2f8e; }
  .footer .pitch { margin-left: auto; text-align: right; color: #f4e7ff;
                   font-size: 27px; font-weight: 700; line-height: 1.22; }
  .footer .pitch .hl { color: #ff8ec4; }
</style>
</head>
<body>

      <path fill="#ff2f8e" d="M52 56c2 10 5 13 15 15-10 2-13 5-15 15-2-10-5-13-15-15 10-2 13-5 15-15z"/>
      <path fill="#ff2f8e" d="M99 56c2 10 5 13 15 15-10 2-13 5-15 15-2-10-5-13-15-15 10-2 13-5 15-15z"/>
